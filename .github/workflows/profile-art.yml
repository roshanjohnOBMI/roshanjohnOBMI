name: Profile art

on:
  schedule:
    - cron: "17 19 * * *"   # daily, 23:17 Dubai time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "README.md"]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the run if any app or tool is disconnected, or the Work table drifts from the map
      - name: Validate stack map
        run: python3 scripts/stack_map.py

      - name: Draw banner, routes board, stack map and site progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/banner.py > assets/banner.svg
          python3 scripts/routes_board.py > assets/routes.svg
          python3 scripts/stack_map.py --json > assets/stack-map.json
          python3 scripts/site_stats.py "${{ github.repository_owner }}" > "$RUNNER_TEMP/site-stats.svg"
          mv "$RUNNER_TEMP/site-stats.svg" assets/site-stats.svg

      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update profile artwork"
          git push
