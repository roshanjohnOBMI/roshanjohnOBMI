<style>
  .fl{animation:rise 11s cubic-bezier(.2,.7,.2,1) infinite both}
  @keyframes rise{0%{opacity:0;transform:translateY(-46px)}5%{opacity:1;transform:translateY(0)}78%{opacity:1;transform:translateY(0)}86%,100%{opacity:0;transform:translateY(0)}}
  .win{animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{fill:#1f4a6b}50%{fill:#3d85b8}}
  .ghost{fill:none;stroke:#5ec8ff;stroke-width:1.2;stroke-dasharray:5 4;opacity:.55}
  .scan{animation:scan 5.5s ease-in-out infinite}
  @keyframes scan{0%,100%{transform:translateY(0);opacity:.0}10%{opacity:.9}50%{transform:translateY(-123px);opacity:.9}60%{opacity:0}}
  .trolley{animation:trol 7s ease-in-out infinite}
  @keyframes trol{0%,100%{transform:translateX(0)}50%{transform:translateX(170px)}}
  .hook{animation:hook 3.5s ease-in-out infinite}
  @keyframes hook{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
  .pk{fill:#5ec8ff;animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-12px);opacity:1}}
  .beacon{animation:blink 1.4s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .play{animation:pulse 2.4s ease-in-out infinite;transform-origin:778px 300px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .arrow{animation:nudge 1.2s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.fl{opacity:1}}
</style>
