<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="How the tools connect: Revit and Navisworks models feed C# and pyRevit add-ins, which push data through Autodesk Platform Services and ACC into the Power Platform and out to dashboards. OBMI Meridian feeds usage and model health back.">
<style>
